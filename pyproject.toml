[project]
name = "component-k2"
version = "1.2.0"
description = "Keboola K2 Component"
requires-python = "~=3.13.0"
dependencies = [
    "keboola.utils==1.1.0",
    "keboola.component==1.3.7",
    "keboola.csvwriter==1.0.1",
    "keboola.http-client==1.0.0",
    "mock==4.0.3",
    "freezegun>=1.5.1",
    "sshtunnel==0.4.0",
    "requests~=2.27.1",
    "paramiko~=2.10.4",
    "cryptography==36.0.2",
    "dateparser~=1.1.1",
]

[tool.uv]
dev-dependencies = [
    "flake8",
    "ruff",
]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "C4", "T20", "RET", "SIM", "ARG"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    "__pycache__",
    "tests",
    "example",
    "venv",
    ".venv",
]

line-length = 120

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.8
target-version = "py38"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.isort]
known-first-party = ["src"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
